# Enable C++ and its standard library
CONFIG_CPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_STD_CPP20=y

# Enable the Pigweed basics
CONFIG_PIGWEED_FUNCTION=y

# Disable some debug optimizations so debugging is easier
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BAS=y
CONFIG_BT_DEVICE_NAME="Firefly v.1"

# Generic Tag
CONFIG_BT_DEVICE_APPEARANCE=512

CONFIG_MAIN_STACK_SIZE=2048

# Reset cause, logged at boot
CONFIG_HWINFO=y

# Shared code (firmware/common, firmware/testing)
CONFIG_FIREFLY_BATTERY=y
CONFIG_FIREFLY_BLUETOOTH=y
CONFIG_FIREFLY_BUZZER=y
CONFIG_FIREFLY_CC1101=y
CONFIG_FIREFLY_COLOR=y
CONFIG_FIREFLY_RGB_LED=y
CONFIG_FIREFLY_TIMER=y
