manifest:
  remotes:
    - name: sdk-nrf
      url-base: https://github.com/nrfconnect
    - name: pigweed
      url-base: https://pigweed.googlesource.com/pigweed
  projects:
    - name: sdk-nrf
      remote: sdk-nrf
      revision: v3.2.6
      path: nrf
      import:
        path-prefix: third_party
        # Only what our images need: sdk-nrf brings in ~50 projects otherwise
        # (Matter, LVGL, OpenThread, TF-M, ...).
        name-allowlist:
          - zephyr
          - nrfxlib
          - hal_nordic
          - cmsis_6
          - segger
          - mbedtls
          - oberon-psa-crypto
    - name: pigweed
      remote: pigweed
      revision: 909513ecf3ab9cbb01160ef38d1649cde88dfb91
      path: third_party/pigweed
