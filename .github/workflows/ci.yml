name: CI

on:
  workflow_dispatch:
  push:
  schedule:
  - cron:  '0 13 * * *' # Every day at 1pm.

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      # Build (and report) every image even if some of them fail.
      fail-fast: false
      matrix:
        # `image` is the name of the resulting .elf file, the GitHub artifact and the Moma artifact.
        include:
          - { app: lock_test, board: lock_v01, image: lock_test }
          - { app: lock, board: lock_v01, image: lock }
          - { app: firefly, board: firefly_v1, image: firefly }
          - { app: activator, board: firefly_v1, image: activator }
          - { app: smoke_test, board: firefly_v1, image: smoke_test_firefly }
          - { app: power_meter, board: power_meter, image: power_meter }
          - { app: rothult_cordyceps, board: cordyceps, image: rothult_cordyceps }
    name: build (${{ matrix.image }})
    env:
      ZEPHYR_BASE: /home/runner/work/firefly_zephyr/firefly_zephyr/third_party/zephyr
      ZEPHYR_TOOLCHAIN_VARIANT: gnuarmemb
      GNUARMEMB_TOOLCHAIN_PATH: /home/runner/work/firefly_zephyr/firefly_zephyr/third_party/pigweed/environment/cipd/packages/arm
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies via APT
        run: sudo apt-get update && sudo apt-get install --no-install-recommends gperf dfu-util device-tree-compiler wget xz-utils file libsdl2-dev
      - name: Install West globally
        run: pip3 install west
      - name: Initialize west workspace
        run: west init -l manifest
      - name: Download dependencies (including Zephyr RTOS, Pigweed and nRF Connect SDK)
        # Only the pinned revisions without history. Not cached: this download is
        # faster than restoring the same files from the GitHub Actions cache.
        run: west update --narrow -o=--depth=1
      - name: Export Zephyr CMake package
        run: west zephyr-export
      # The Pigweed environment (configured in pigweed_env/) is cached, keyed on the
      # manifest (which pins Pigweed, Zephyr and the NCS Python requirements) and the
      # environment config: restoring it is much faster than a bootstrap.
      - name: Restore Pigweed environment from cache
        id: pigweed-cache
        uses: actions/cache@v6
        with:
          path: third_party/pigweed/environment
          key: pigweed-project-env-${{ runner.os }}-${{ hashFiles('manifest/west.yml', 'pigweed_env/*.json') }}
          # Bootstrap on top of an older environment only downloads what changed.
          restore-keys: pigweed-project-env-${{ runner.os }}-
      - name: Bootstrap Pigweed
        # activate.sh (used by the steps below) works directly on a restored environment.
        if: steps.pigweed-cache.outputs.cache-hit != 'true'
        run: source ./pigweed_env/bootstrap.sh
      # Every step runs in a fresh shell, so the Python dependencies have to be installed
      # in the same step that activates the environment, to end up in its virtualenv.
      # The NCS requirements downgrade protobuf, which breaks Pigweed's protobuf codegen.
      - name: Install Zephyr and NCS python dependencies to Pigweed's virtualenv
        run: >-
          source ./pigweed_env/activate.sh &&
          pip install -r ./third_party/zephyr/scripts/requirements.txt &&
          pip install -r ./third_party/nrf/scripts/requirements.txt &&
          pip install -c ./third_party/pigweed/pw_env_setup/py/pw_env_setup/virtualenv_setup/constraint.list protobuf
      - name: Validate Zephyr environment
        run: west manifest --validate
      - name: Build ${{ matrix.app }} for ${{ matrix.board }}
        run: >-
          source ./pigweed_env/activate.sh &&
          west build firmware/${{ matrix.app }} --pristine --board ${{ matrix.board }} &&
          mv ./build/${{ matrix.app }}/zephyr/zephyr.elf ${{ matrix.image }}.elf
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}.elf
          path: ${{ matrix.image }}.elf
      - name: Upload ${{ matrix.image }}.elf to Moma
        uses: aeremin/moma/.github/actions/moma-upload@v0.0.2
        with:
          userId: ${{ github.actor }}
          artifactId: ${{ matrix.image }}
          file: ${{ matrix.image }}.elf
          commitHash: ${{ github.sha }}
  # Hardware-in-the-loop tests on the test rack, see tests/hil and docs/INTEGRATION_TESTING.md.
  hardware_test:
    runs-on: self-hosted
    needs: [build]
    timeout-minutes: 20
    env:
      # Black Magic Probes attached to the test boards (without the -if00 / -if02 suffix).
      FIREFLY_PROBE: /dev/serial/by-id/usb-Black_Magic_Debug_Black_Magic_Probe__BlackPill-F401CC__v1.10.2-dirty_365938773034
      LOCK_PROBE: /dev/serial/by-id/usb-Black_Magic_Debug_Black_Magic_Probe__BlackPill-F411CE__v1.10.2-dirty_3951376E3233
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*.elf'
          path: elf
          merge-multiple: true
      - name: Install test dependencies
        run: python3 -m venv .venv && .venv/bin/pip install -r tests/hil/requirements.txt
      - name: Run hardware-in-the-loop tests
        # --ble uses the runner's (Raspberry Pi 3) onboard Bluetooth adapter through BlueZ.
        run: .venv/bin/pytest tests/hil --elf-dir elf --require-all-boards --ble -v -rs --junitxml=hil-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hil-report
          path: hil-report.xml
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [build]
    permissions:
      contents: write
    steps:
      # For RELEASE.md, used as the release body.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*.elf'
          merge-multiple: true
      - uses: ncipollo/release-action@v1
        with:
          artifacts: '*.elf'
          bodyFile: RELEASE.md
          token: ${{ secrets.GITHUB_TOKEN }}
